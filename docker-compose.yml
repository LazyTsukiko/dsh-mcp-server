services:
  napcat:
    environment:
      - NAPCAT_UID=0
      - NAPCAT_GID=0
      - MODE=astrbot
    ports:
      - 6099:6099
    container_name: napcat
    restart: always
    image: mlikiowa/napcat-docker:latest
    volumes:
      - ./data:/AstrBot/data
      - ./napcat/config:/app/napcat/config
      - ./ntqq:/app/.config/QQ
    networks:
      - astrbot_network
  astrbot:
    environment:
      - TZ=Asia/Shanghai
    image: soulter/astrbot:latest
    container_name: astrbot
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6185:6185"
      - "5000:5000"
      - "7833:7833"
    volumes:
      - ./data:/AstrBot/data
    networks:
      - astrbot_network
    depends_on:
      - napcat
networks:
  astrbot_network:
    driver: bridge
